<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email - Admin Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .users-list {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        .user-card {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-email {
            font-weight: 600;
            color: #333;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.confirmed {
            background: #d4edda;
            color: #155724;
        }
        .badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Email Confirmation Tool</h1>
        <p class="subtitle">Manually confirm user emails in Supabase</p>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                placeholder="owenozmubb07@gmail.com"
                required
            >
        </div>

        <button id="confirmBtn" onclick="confirmEmail()">
            Confirm Email
        </button>

        <div id="result" class="result"></div>

        <div class="users-list">
            <h2 style="margin-bottom: 16px; color: #333;">All Users</h2>
            <div id="usersList" class="loading">Loading users...</div>
        </div>
    </div>

    <script>
        // Load users on page load
        window.addEventListener('load', loadUsers)

        async function loadUsers() {
            try {
                const response = await fetch('/api/confirm-email')
                const data = await response.json()

                const usersList = document.getElementById('usersList')
                
                if (data.error) {
                    usersList.innerHTML = `<p style="color: #dc3545;">Error: ${data.error}</p>`
                    return
                }

                if (data.users.length === 0) {
                    usersList.innerHTML = '<p style="color: #666;">No users found</p>'
                    return
                }

                usersList.innerHTML = data.users.map(user => `
                    <div class="user-card">
                        <div>
                            <div class="user-email">${user.email}</div>
                            <div style="font-size: 12px; color: #666; margin-top: 4px;">
                                Created: ${new Date(user.createdAt).toLocaleDateString()}
                            </div>
                        </div>
                        <span class="badge ${user.confirmed ? 'confirmed' : 'pending'}">
                            ${user.confirmed ? '✓ Confirmed' : '⏳ Pending'}
                        </span>
                    </div>
                `).join('')

            } catch (error) {
                document.getElementById('usersList').innerHTML = 
                    `<p style="color: #dc3545;">Error loading users</p>`
            }
        }

        async function confirmEmail() {
            const email = document.getElementById('email').value
            const result = document.getElementById('result')
            const button = document.getElementById('confirmBtn')

            if (!email) {
                showResult('Please enter an email address', 'error')
                return
            }

            button.disabled = true
            button.textContent = 'Confirming...'
            result.style.display = 'none'

            try {
                const response = await fetch('/api/confirm-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                })

                const data = await response.json()

                if (data.success || data.message) {
                    showResult(data.message || 'Email confirmed successfully! ✓', 'success')
                    setTimeout(loadUsers, 1000) // Reload users list
                } else if (data.error) {
                    showResult(`Error: ${data.error}`, 'error')
                    
                    if (data.availableUsers) {
                        const userList = data.availableUsers
                            .map(u => `${u.email} (${u.confirmed ? 'confirmed' : 'pending'})`)
                            .join(', ')
                        showResult(`User not found. Available: ${userList}`, 'error')
                    }
                }

            } catch (error) {
                showResult('Network error. Make sure the server is running.', 'error')
            } finally {
                button.disabled = false
                button.textContent = 'Confirm Email'
            }
        }

        function showResult(message, type) {
            const result = document.getElementById('result')
            result.textContent = message
            result.className = `result ${type}`
            result.style.display = 'block'
        }

        // Allow Enter key to submit
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmEmail()
        })
    </script>
</body>
</html>
